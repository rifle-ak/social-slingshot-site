<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Keep the sign-in code out of Referer headers and search engines. -->
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Returning to Social Slingshot</title>
  <link rel="stylesheet" href="../../assets/site.css">
</head>
<body>
<main class="doc">
  <h1>Returning to Social Slingshot…</h1>
  <p>TikTok sign-in finished. Sending you back to Slingshot running on your computer.</p>
  <p class="muted">If nothing happens, make sure Slingshot is running, then <a id="manual" href="http://127.0.0.1:8000/">continue here</a>.</p>
</main>
<script>
  // TikTok only allows https redirect URIs, but Slingshot runs locally over http.
  // This page forwards TikTok's one-time code to the local app and nothing else.
  (function () {
    var allowed = ["code", "state", "scopes", "error", "error_description"];
    var src = new URLSearchParams(window.location.search);
    var out = new URLSearchParams();
    allowed.forEach(function (k) { if (src.has(k)) out.set(k, src.get(k)); });
    if (!out.has("state")) return;
    var target = "http://127.0.0.1:8000/connect/tiktok/callback?" + out.toString();
    document.getElementById("manual").href = target;
    window.location.replace(target);
  })();
</script>
</body>
</html>
