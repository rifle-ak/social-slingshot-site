<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- rising trail -->
  <path d="M512 470 L512 250" stroke="#fde68a" stroke-width="22" stroke-linecap="round" stroke-dasharray="2 54" opacity=".9"/>
  <!-- stone -->
  <circle cx="512" cy="200" r="62" fill="#fbbf24"/>
  <!-- band -->
  <path d="M330 470 Q512 640 694 470" fill="none" stroke="#fde68a" stroke-width="26" stroke-linecap="round"/>
  <!-- frame: Y fork -->
  <path d="M330 470 C330 600 420 650 512 690 C604 650 694 600 694 470"
        fill="none" stroke="#fff" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M512 690 L512 880" stroke="#fff" stroke-width="80" stroke-linecap="round"/>
</svg>
